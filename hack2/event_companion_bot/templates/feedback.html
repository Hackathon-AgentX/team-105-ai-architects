<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Feedback — AI & Technology Workshop</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <link rel="stylesheet" href="/static/pages.css"/>
</head>
<body class="page-body">
  <div class="page-wrap">
    <a class="back-btn" href="/">← Back to Chat</a>
    <div class="page-header">
      <span class="page-icon">⭐</span>
      <div>
        <h1>Event Feedback</h1>
        <p>Tell us about your experience</p>
      </div>
    </div>

    <div class="page-card" id="fbCard">
      <p class="fb-rate-label">Rate the Event</p>

      <!-- Emoji reaction display -->
      <div class="fb-emoji-wrap" id="fbEmojiWrap">
        <span class="fb-emoji-big" id="fbEmoji">🤔</span>
        <span class="fb-emoji-msg" id="fbEmojiMsg">Tap a star to rate</span>
      </div>

      <div class="star-page-row" id="starRow">
        <span class="star-page" data-v="1">★</span>
        <span class="star-page" data-v="2">★</span>
        <span class="star-page" data-v="3">★</span>
        <span class="star-page" data-v="4">★</span>
        <span class="star-page" data-v="5">★</span>
      </div>
      <p class="star-page-label" id="starLabel">Tap a star to rate</p>
      <textarea id="fbMsg" placeholder="Share your thoughts, suggestions or comments…" rows="5"></textarea>
      <button class="page-btn" id="submitFb">Submit Feedback</button>

      <div class="success-box" id="fbSuccess" style="display:none">
        <div class="success-big-icon" id="successEmoji">💙</div>
        <h2>Thank You!</h2>
        <p id="successMsg">Your valuable feedback has been submitted.<br>We appreciate your time!</p>
        <a href="/" class="page-btn" style="display:inline-block;margin-top:16px;text-decoration:none;">← Back to Chat</a>
      </div>
    </div>
  </div>

  <script>
    let selectedRating = 0;

    const ratings = [
      null,
      { emoji: "😞", label: "Poor",      color: "#e74c3c", msg: "We're sorry to hear that. We'll improve!" },
      { emoji: "😐", label: "Fair",       color: "#f0a500", msg: "Thanks! We'll work on getting better." },
      { emoji: "🙂", label: "Good",       color: "#f0c040", msg: "Glad you liked it! Your feedback helps us." },
      { emoji: "😊", label: "Very Good",  color: "#4dc47a", msg: "Awesome! So happy you had a great time!" },
      { emoji: "🤩", label: "Excellent",  color: "#5ca8e8", msg: "WOW! You made our day! Thank you so much!" }
    ];

    const stars = document.querySelectorAll(".star-page");

    function updateEmoji(rating) {
      const r = ratings[rating];
      if (!r) {
        document.getElementById("fbEmoji").textContent    = "🤔";
        document.getElementById("fbEmojiMsg").textContent = "Tap a star to rate";
        document.getElementById("fbEmojiMsg").style.color = "#8ba3b8";
        document.getElementById("fbEmoji").style.animation = "none";
        return;
      }
      const emojiEl = document.getElementById("fbEmoji");
      const msgEl   = document.getElementById("fbEmojiMsg");
      emojiEl.textContent    = r.emoji;
      msgEl.textContent      = r.msg;
      msgEl.style.color      = r.color;
      // bounce animation
      emojiEl.style.animation = "none";
      void emojiEl.offsetWidth;
      emojiEl.style.animation = "fbEmojiPop .4s ease";
    }

    stars.forEach(s => {
      s.addEventListener("mouseover", () => {
        stars.forEach(x => x.classList.toggle("active", +x.dataset.v <= +s.dataset.v));
        updateEmoji(+s.dataset.v);
      });
      s.addEventListener("mouseout", () => {
        stars.forEach(x => x.classList.toggle("active", +x.dataset.v <= selectedRating));
        updateEmoji(selectedRating);
      });
      s.addEventListener("click", () => {
        selectedRating = +s.dataset.v;
        const r = ratings[selectedRating];
        document.getElementById("starLabel").textContent = r.label;
        stars.forEach(x => x.classList.toggle("active", +x.dataset.v <= selectedRating));
        updateEmoji(selectedRating);
      });
    });

    document.getElementById("submitFb").addEventListener("click", async () => {
      if (!selectedRating) { alert("Please select a star rating!"); return; }
      const message = document.getElementById("fbMsg").value.trim();
      try {
        const res  = await fetch("/api/feedback", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ rating: selectedRating, message })
        });
        const json = await res.json();
        if (json.status === "ok") {
          const r = ratings[selectedRating];
          document.getElementById("successEmoji").textContent = r.emoji;
          document.getElementById("successMsg").innerHTML =
            `<strong>${r.label}</strong> rating received!<br>Your feedback has been submitted. We appreciate your time!`;
          document.getElementById("submitFb").style.display = "none";
          document.getElementById("fbMsg").style.display    = "none";
          document.getElementById("starRow").style.pointerEvents = "none";
          document.getElementById("fbEmojiWrap").style.display   = "none";
          document.getElementById("starLabel").style.display     = "none";
          document.getElementById("fbSuccess").style.display     = "block";
        } else { alert(json.message); }
      } catch { alert("Network error. Please try again."); }
    });
  </script>
</body>
</html>
