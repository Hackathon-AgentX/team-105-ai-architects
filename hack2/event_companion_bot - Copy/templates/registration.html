<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Registration — AI & Technology Workshop</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <link rel="stylesheet" href="/static/pages.css"/>
</head>
<body class="page-body">
  <div class="page-wrap">
    <a class="back-btn" href="/">← Back to Chat</a>
    <div class="page-header">
      <span class="page-icon">📝</span>
      <div>
        <h1>Event Registration</h1>
        <p>AI &amp; Technology Workshop — SNJB Chandwad</p>
      </div>
    </div>

    <div class="page-card" id="regCard">
      <form id="regForm" novalidate>
        <div class="field-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Enter your full name" required/>
        </div>
        <div class="field-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="you@email.com" required/>
        </div>
        <div class="field-group">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" placeholder="+91-XXXXXXXXXX" required/>
        </div>
        <div class="field-group">
          <label>Roll Number</label>
          <input type="text" id="regRoll" placeholder="e.g. 18"/>
        </div>
        <div class="field-group">
          <label>College / University</label>
          <input type="text" id="regCollege" placeholder="SNJB College of Engineering" required/>
        </div>
        <button type="submit" class="page-btn">Register Now →</button>
      </form>

      <div class="success-box" id="regSuccess" style="display:none">
        <div class="success-big-icon">✅</div>
        <h2>Registration Successful!</h2>
        <p id="regMsg"></p>
        <a href="/" class="page-btn" style="display:inline-block;margin-top:16px;text-decoration:none;">← Back to Chat</a>
      </div>
    </div>

    <div class="page-info-box">
      <p>📅 <strong>Event Date:</strong> 14 August 2026</p>
      <p>⏰ <strong>Time:</strong> 10:00 AM – 4:00 PM</p>
      <p>✅ <strong>Registration:</strong> FREE</p>
      <p>🏛️ <strong>Venue:</strong> SNJB College of Engineering, Chandwad — Lab No. 235</p>
    </div>
  </div>

  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name    = document.getElementById("regName").value.trim();
      const email   = document.getElementById("regEmail").value.trim();
      const phone   = document.getElementById("regPhone").value.trim();
      const roll_no = document.getElementById("regRoll").value.trim() || "-";
      const college = document.getElementById("regCollege").value.trim();
      if (!name || !email || !phone || !college) { alert("Please fill all fields!"); return; }
      try {
        const res  = await fetch("/api/register", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({name, email, phone, college, roll_no})
        });
        const json = await res.json();
        if (json.status === "ok") {
          document.getElementById("regForm").style.display = "none";
          document.getElementById("regSuccess").style.display = "block";
          document.getElementById("regMsg").innerHTML =
            `Welcome, <strong>${name}</strong>!<br><br>Your Registration ID:<br>
             <span style="font-size:28px;font-weight:800;color:#5ca8e8">${json.reg_id}</span><br><br>
             Please save this ID for event check-in.`;
        } else { alert(json.message); }
      } catch { alert("Network error. Please try again."); }
    });
  </script>
</body>
</html>
